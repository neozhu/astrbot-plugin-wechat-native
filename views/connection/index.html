<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeChat Native · 连接测试</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card" aria-labelledby="title">
      <header>
        <span class="mark" aria-hidden="true">W</span>
        <h1 id="title">WeChat Native</h1>
      </header>
      <div id="robot-picker" class="picker" hidden>
        <label for="robot-select">机器人</label>
        <select id="robot-select"></select>
      </div>
      <dl>
        <div>
          <dt>连接状态</dt>
          <dd id="connection-status" data-state="unchecked" role="status" aria-live="polite">未检测</dd>
        </div>
        <div>
          <dt>微信在线状态</dt>
          <dd id="wechat-status">未检测</dd>
        </div>
      </dl>
      <p id="failure-reason" role="alert" hidden></p>
      <button id="test-connection" type="button" disabled>测试连接</button>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
