name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install supported AstrBot and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test with mock Native HTTP/SSE (no WeChat credentials)
        run: python -m pytest --cov=. --cov-report=term-missing
      - name: Compile plugin modules
        run: python -m compileall -q main.py adapter.py config.py event.py native_client.py state.py
